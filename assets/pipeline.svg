<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Data flows from raw sources through ingestion, a warehouse and analysis into decisions">
<style>
 .bg{fill:#0a1328} .track{stroke:#24345c;stroke-width:2;stroke-dasharray:4 6;fill:none}
 .pkt{fill:#7fe3d6}
 .node{fill:#101d3d;stroke:#3a5288;stroke-width:1.5} .nodehot{stroke:#f5b942}
 .ring{fill:none;stroke:#7fe3d6;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 2.5s ease-out infinite}
 .ring.hot{stroke:#f5b942}
