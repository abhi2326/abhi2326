 .ic{fill:none;stroke:#cfe0ff;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round} .ichot{stroke:#f5c76a}
 .ic rect,.ic circle{fill:#cfe0ff;stroke:none} .ichot rect{fill:#f5c76a}
 .t{font:700 15px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#e8edf7;text-anchor:middle}
 .s{font:500 12.5px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#8fa3cc;text-anchor:middle}
 @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
